<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container" id="chat-container">
        <div id="connection-banner" class="connection-banner hidden" role="status">Reconnecting…</div>
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Chat App</h2>
                <div class="user-info">
                    <span id="current-username"></span>
                    <button id="logout-btn" class="btn-small">Logout</button>
                </div>
            </div>
            <div class="users-list">
                <h3>Users</h3>
                <label class="visually-hidden" for="user-search">Search users</label>
                <input type="search" id="user-search" placeholder="Search users" autocomplete="off">
                <div id="users-list" role="list"></div>
            </div>
        </div>
        
        <div class="chat-area">
            <div class="chat-header">
                <button type="button" id="back-btn" class="back-btn" aria-label="Back to conversations">Back</button>
                <h3 id="chat-with-user">Select a user to chat</h3>
            </div>
            <div class="thread-body">
                <div class="messages-container" id="messages-container" aria-live="polite">
                    <div class="empty-state no-chat-selected">
                        <p class="empty-title">Pick a conversation</p>
                        <p>Choose someone in the list to start chatting. New accounts show up here after they sign up.</p>
                    </div>
                </div>
                <button type="button" id="jump-latest" class="jump-latest hidden">1 new message</button>
            </div>
            <div class="message-input">
                <p id="typing-status" class="typing-status" aria-live="polite"></p>
                <p id="composer-hint" class="composer-hint hidden"></p>
                <form id="message-form">
                    <label class="visually-hidden" for="message-input">Message</label>
                    <textarea id="message-input" placeholder="Type a message…" maxlength="5000" rows="1" disabled></textarea>
                    <button type="submit" class="btn" id="send-btn" disabled>Send</button>
                </form>
                <span id="char-count" class="char-count hidden"></span>
            </div>
        </div>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>
    
    <script src="chat.js"></script>
</body>
</html>
